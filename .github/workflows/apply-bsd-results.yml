name: Apply BSD results

# Fetches confirmed match results directly from SoccerHub Data Service
# (BSD) and commits them to 2026-27/ng.1.json.
#
# PROVENANCE NOTE: BSD has no published terms of service covering
# redistribution (checked: no ToS at signup, login, dashboard, or in
# the confirmation email). Using BSD's scores directly here is a
# deliberate, accepted decision - not an oversight. If this ever needs
# to change, scripts/apply_official_results.py (sourcing from
# npfl.com.ng, the league's own public site) is a drop-in replacement
# with no schema differences - just swap which script this workflow
# runs. See scripts/apply_bsd_results.py's docstring for more.
#
# Uses .automation/bsd_id_map.json (restored from the BSD_ID_MAP_JSON
# secret) to know which BSD event corresponds to which fixture - same
# mapping check-fixture-status.yml and refresh-bsd-id-map.yml rely on.
# Falls back to opening a "result-needed" GitHub issue for any fixture
# it can't confirm a score for, so nothing is silently skipped.

on:
  schedule:
    - cron: "0-59/15 14-20 * * 5,6,0"    # every 15 min, Fri/Sat/Sun, 14:00-20:59 UTC (runs before apply-official-results.yml's :05 slot)
    - cron: "10 8,16 * * 1,2,3,4"        # twice a day, Mon-Thu
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  apply-bsd-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write fixture ID mapping from secret
        env:
          BSD_ID_MAP_JSON: ${{ secrets.BSD_ID_MAP_JSON }}
        run: |
          mkdir -p .automation
          printf '%s' "$BSD_ID_MAP_JSON" > .automation/bsd_id_map.json

      - name: Apply BSD results
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BSD_API_BASE_URL: ${{ secrets.BSD_API_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/apply_bsd_results.py

      - name: Commit any result updates
        run: |
          if git diff --quiet -- 2026-27/ng.1.json; then
            echo "No result changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2026-27/ng.1.json
          git commit -m "Auto-update results from SoccerHub Data Service [skip ci]"
          git push
