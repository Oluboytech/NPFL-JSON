name: Apply official NPFL results

# Auto-fills confirmed match results from npfl.com.ng (the league's own
# official site - a primary public source, safe to read scores from
# directly) and commits them to 2026-27/ng.1.json. This runs
# independently of check-fixture-status.yml: that workflow uses
# SoccerHub Data Service only to flag that a match PROBABLY finished
# (never republishing that data directly - see
# scripts/check_fixture_status.py). THIS workflow is what actually
# writes a score, sourced from npfl.com.ng instead.
#
# Safety net: if the official site is unreachable, its page format has
# changed, or a match genuinely has no result yet, this falls back to
# opening the same kind of "result-needed" GitHub issue
# check_fixture_status.py uses - so a scraping break is never silent.
# See scripts/apply_official_results.py for the full design rationale.

on:
  schedule:
    # Same cadence as check-fixture-status.yml's matchday window, offset
    # by a few minutes so a status-check run has usually landed first.
    - cron: "5-59/15 14-20 * * 5,6,0"   # every 15 min, Fri/Sat/Sun, 14:00-20:59 UTC (runs after apply-bsd-results.yml's :00 slot)
    - cron: "20 8,16 * * 1,2,3,4"       # twice a day, Mon-Thu (runs after apply-bsd-results.yml's :10 slot)
  workflow_dispatch: {}                  # manual trigger for testing

permissions:
  contents: write
  issues: write

jobs:
  apply-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so this job can commit back to the repo.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply official results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/apply_official_results.py

      - name: Commit any result updates
        run: |
          if git diff --quiet -- 2026-27/ng.1.json; then
            echo "No result changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2026-27/ng.1.json
          git commit -m "Auto-update results from npfl.com.ng [skip ci]"
          git push
